  <script>
    // Apply the theme before first paint to avoid a light flash (mirrors useTheme.js)
    (function () {
      var stored = null
      try { stored = localStorage.getItem('theme') } catch (e) {}
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) {
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151311')
      }
    })()
  </script>
